<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión — EEST N°1</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #071D3A;
    color: #F8F9FA;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .caja { max-width: 360px; }
  img { width: 84px; height: 84px; margin-bottom: 20px; border-radius: 18px; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { font-size: 14px; color: #C9D2E0; line-height: 1.5; margin: 0 0 22px; }
  button {
    background: #3498DB;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="caja">
    <img src="assets/img/icons/icon-192.png" alt="EEST N°1">
    <h1>Sin conexión</h1>
    <p>No se pudo cargar esta página porque no hay conexión a internet. Revisá tu conexión e intentá de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
